name: ASR Benchmark Paraformer Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/asr-benchmark-paraformer.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download Paraformer Q8
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle
          curl -L --fail --retry 3 \
            'https://huggingface.co/FunAudioLLM/Paraformer-GGUF/resolve/main/paraformer-q8.gguf?download=true' \
            -o bundle/paraformer-q8.gguf
          sha256sum bundle/paraformer-q8.gguf | tee bundle/SHA256SUMS.txt
          ls -lh bundle/paraformer-q8.gguf bundle/SHA256SUMS.txt

      - name: Upload benchmark model
        uses: actions/upload-artifact@v4
        with:
          name: asr-benchmark-paraformer-v1
          path: bundle/
          retention-days: 1
          compression-level: 1
