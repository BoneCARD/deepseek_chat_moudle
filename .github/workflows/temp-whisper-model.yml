name: Temporary Whisper Model Fetch

on:
  push:
    paths:
      - '.github/workflows/temp-whisper-model.yml'
  pull_request:

permissions:
  contents: read

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download multilingual Whisper tiny q5_1 model
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 3 \
            'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny-q5_1.bin?download=true' \
            -o ggml-tiny-q5_1.bin
          echo '818710568da3ca15689e31a743197b520007872ff9576237bda97bd1b469c3d7  ggml-tiny-q5_1.bin' | sha256sum -c -
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-tiny-q5_1-model
          path: ggml-tiny-q5_1.bin
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
