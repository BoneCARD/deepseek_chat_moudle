name: ASR Benchmark Whisper Turbo Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/asr-benchmark-whisper-turbo.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download and split Whisper large-v3-turbo q5_0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle parts
          curl -L --fail --retry 3 \
            'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin?download=true' \
            -o bundle/ggml-large-v3-turbo-q5_0.bin
          echo 'e050f7970618a659205450ad97eb95a18d69c9ee  bundle/ggml-large-v3-turbo-q5_0.bin' | sha1sum -c -
          sha256sum bundle/ggml-large-v3-turbo-q5_0.bin | tee bundle/SHA256SUMS.txt
          split -b 280M -d -a 2 bundle/ggml-large-v3-turbo-q5_0.bin parts/model.part-
          cp bundle/SHA256SUMS.txt parts/
          sha256sum parts/model.part-* | tee parts/PART_SHA256SUMS.txt
          ls -lh bundle/ggml-large-v3-turbo-q5_0.bin parts/*

      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: asr-benchmark-whisper-turbo-q5-part00
          path: |
            parts/model.part-00
            parts/SHA256SUMS.txt
            parts/PART_SHA256SUMS.txt
          retention-days: 1
          compression-level: 1

      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: asr-benchmark-whisper-turbo-q5-part01
          path: parts/model.part-01
          retention-days: 1
          compression-level: 1
